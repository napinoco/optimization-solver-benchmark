site:
  title: "Optimization Solver Benchmark"
  author: "Naoki Ito"
  description: "Benchmarking optimization solvers with fair comparison"
  url: "https://napinoco.github.io/optimization-solver-benchmark"
  overview: |
    A reproducible benchmarking framework for optimization solvers across LP, QP, SOCP, and SDP problems using standardized libraries (DIMACS, SDPLIB). The system conducts systematic performance evaluation establishing "out of the box" performance baselines rather than optimized configurations, and publishes transparent results for research community use.
    
    <strong>Source Code</strong>
    The benchmarking code is available at <a href="https://github.com/napinoco/optimization-solver-benchmark">https://github.com/napinoco/optimization-solver-benchmark</a>
  results_matrix_note: |
    ⚠️ CLARABEL has SIGKILL issue due to excessive memory consumption on large SDP problems, e.g. bm1.

solvers:
  display_order:
    - matlab_sdpt3
    - matlab_sedumi
    - cvxpy_sdpa
    - cvxpy_clarabel
    - cvxpy_cvxopt
    - cvxpy_scs
    - cvxpy_ecos
    - cvxpy_scip
    - cvxpy_highs
    - cvxpy_osqp
    - scipy_linprog

